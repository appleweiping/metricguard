[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metricguard"
version = "0.2.0"
description = "Contract-driven validation for NLP evaluation metrics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wei Ping" }]
keywords = ["nlp", "evaluation", "metrics", "testing", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
  "twine>=5",
]

[project.scripts]
metricguard = "metricguard.cli:main"

[project.urls]
Changelog = "https://github.com/appleweiping/metricguard/blob/main/CHANGELOG.md"
Discussions = "https://github.com/appleweiping/metricguard/discussions"
Documentation = "https://github.com/appleweiping/metricguard#readme"
Issues = "https://github.com/appleweiping/metricguard/issues"
Source = "https://github.com/appleweiping/metricguard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metricguard = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=metricguard --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["metricguard"]
mypy_path = "src"
