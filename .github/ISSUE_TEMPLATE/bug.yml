name: Bug report
description: Report a reproducible defect in MetricGuard
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: MetricGuard version
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: Python version
      options: ["3.10", "3.11", "3.12", "3.13", "3.14", Other]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and minimal synthetic cases/configuration.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: Include OS, installation method, exact command, and traceback.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and removed private evaluation data.
          required: true
